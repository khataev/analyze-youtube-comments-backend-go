# sqlc генерирует типобезопасный Go-код из SQL: запросы пишутся руками, а структуры
# и функции для них — нет. Схему sqlc берёт прямо из миграций goose.
# Перегенерировать: make generate
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/modules/analysis/analysisdb/queries.sql
    gen:
      go:
        package: analysisdb
        out: internal/modules/analysis/analysisdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true # NULL-колонки — *string, а не pgtype.Text
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
