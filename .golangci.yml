# golangci-lint v2: набор линтеров поверх стандартного (govet, errcheck, staticcheck, unused, ineffassign).
version: "2"

linters:
  default: standard
  enable:
    - bodyclose     # не забыт resp.Body.Close()
    - depguard      # границы пакетов: core не зависит от modules (см. settings)
    - errorlint     # ошибки сравниваются через errors.Is/As, а не ==
    - gocritic
    - misspell
    - noctx         # HTTP-запросы и т.п. только с context
    - revive        # стиль: комментарии к экспортируемым именам и пр.
    - sloglint      # единообразные пары ключ-значение в slog
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    # Направление зависимостей: cmd → httpapi → modules → core. Компилятор запрещает только
    # циклы, а это правило запрещает и «нижнему» слою знать о «верхнем».
    depguard:
      rules:
        core:
          files: ["**/internal/core/**/*.go"]
          deny:
            - pkg: ytcomments/internal/modules
              desc: "core — инфраструктура без бизнес-смысла и не знает о модулях"
            - pkg: ytcomments/internal/httpapi
              desc: "core не знает о сборке приложения"
            - pkg: ytcomments/migrations
              desc: "core не знает о схеме приложения: миграции передаются параметром"
        modules:
          files: ["**/internal/modules/**/*.go"]
          deny:
            - pkg: ytcomments/internal/httpapi
              desc: "модули не знают о сборке приложения"
    sloglint:
      kv-only: true
      context: scope  # если в функции есть ctx — пишем через *Context-методы
  exclusions:
    presets: [std-error-handling]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [ytcomments]
