# Redis и Postgres общие для всех backend-* и запускаются отдельно:
#   docker compose -f ../docker-compose.yml up -d
# Здесь только сервисы этого backend: migrate, api и worker.

# Общая часть сервисов (YAML-якорь): один образ с тремя бинарниками, отличается точка входа.
x-app: &app
  build: .
  image: ytcomments-go:latest # один тег: образ собирается один раз, остальные берут его из кэша
  env_file: .env
  environment:
    # Внутри сети ayc-infra сервисы доступны по именам, а не через localhost
    REDIS_URL: redis://redis:6379/1
    DATABASE_URL: postgres://app:app@postgres:5432/analysis_go?sslmode=disable
  networks: [infra]

services:
  # Одноразовый: создать базу, если её нет, и применить миграции (rails db:prepare).
  # Нужен только DATABASE_URL, ключи YouTube и LLM migrate не читает.
  migrate:
    <<: *app
    entrypoint: ["/app/migrate", "prepare"]

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    entrypoint: ["/app/worker"]
    # Воркер ждёт текущие задачи до 25 с (shutdownTimeout), даём запас до SIGKILL
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }

networks:
  infra:
    external: true # сеть создаёт ../docker-compose.yml, здесь к ней только подключаемся
    name: ayc-infra
